services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: agenda_contactos
      DB_USER: agenda
      DB_PASS: ${AGENDA_DB_PASSWORD:?Define AGENDA_DB_PASSWORD en tu entorno}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: agenda_contactos
      MYSQL_USER: agenda
      MYSQL_PASSWORD: ${AGENDA_DB_PASSWORD:?Define AGENDA_DB_PASSWORD en tu entorno}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - agenda_data:/var/lib/mysql
      - ./database/agenda_contactos.sql:/docker-entrypoint-initdb.d/01-agenda.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  agenda_data:
